<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ShowMate - Add Product/Service</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus, textarea:focus {
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.4);
            border-color: #FFD700 !important;
        }
        .step-transition {
            transition: all 0.3s ease-in-out;
        }
        .success-pulse {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(42, 181, 125, 0.4); }
            50% { border-color: rgba(42, 181, 125, 1); }
            100% { border-color: rgba(42, 181, 125, 0.4); }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffe16d",
                        "secondary-container": "#1f477b",
                        "secondary-fixed-dim": "#a7c8ff",
                        "on-secondary-fixed-variant": "#1f477b",
                        "on-error": "#690005",
                        "on-surface": "#e2e2e2",
                        "primary-container": "#ffd700",
                        "on-background": "#e2e2e2",
                        "on-primary": "#3a3000",
                        "ui-gray": "#404040",
                        "success-green": "#2AB57D",
                        "on-error-container": "#ffdad6",
                        "surface-tint": "#e9c400",
                        "surface-container-highest": "#333535",
                        "on-tertiary-fixed": "#002022",
                        "on-secondary-fixed": "#001b3c",
                        "error-container": "#93000a",
                        "on-tertiary": "#00363a",
                        "on-tertiary-fixed-variant": "#004f54",
                        "secondary-fixed": "#d5e3ff",
                        "outline-variant": "#4d4732",
                        "on-primary-fixed": "#221b00",
                        "surface-container-lowest": "#0c0f0f",
                        "surface-dim": "#121414",
                        "secondary": "#a7c8ff",
                        "surface-container-high": "#282a2b",
                        "on-primary-container": "#705e00",
                        "background": "#121414",
                        "soft-blue": "#E0F3F7",
                        "inverse-surface": "#e2e2e2",
                        "surface-container": "#1e2020",
                        "surface-bright": "#37393a",
                        "surface-container-low": "#1a1c1c",
                        "primary": "#fff6df",
                        "tertiary": "#defcff",
                        "surface-deep": "#002244",
                        "tertiary-fixed": "#79f5ff",
                        "inverse-primary": "#705d00",
                        "on-secondary-container": "#93b6f1",
                        "on-secondary": "#003061",
                        "primary-fixed-dim": "#e9c400",
                        "surface-variant": "#333535",
                        "outline": "#999077",
                        "on-tertiary-container": "#006a70",
                        "surface": "#121414",
                        "inverse-on-surface": "#2f3131",
                        "on-surface-variant": "#d0c6ab",
                        "on-primary-fixed-variant": "#544600",
                        "tertiary-fixed-dim": "#00dbe8",
                        "error": "#ffb4ab",
                        "tertiary-container": "#00f1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "card-gap": "0.75rem",
                        "base": "4px",
                        "stack-gap": "1rem",
                        "touch-target-min": "44px",
                        "container-padding": "1.25rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],
                        "cta": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "label-lg": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "cta": ["16px", {"lineHeight": "1", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- Top Navigation Header -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-touch-target-min bg-background border-b border-white/10 mx-auto left-1/2">
<button aria-label="Back to Catalog" class="flex items-center gap-2 text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="font-label-lg text-label-lg">Catalog</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary-container">ShowMate</h1>
<div class="w-11"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-24 px-container-padding mx-auto min-h-screen">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-8 mt-4">
<div class="h-1 flex-1 bg-primary-container rounded-full transition-colors duration-300" id="step-dot-1"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full transition-colors duration-300" id="step-dot-2"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full transition-colors duration-300" id="step-dot-3"></div>
</div>
<!-- Laravel/Inertia.js Implementation Note: Use useForm() hook for state management. Bind inputs using v-model (Vue) or value/onChange (React). Handle 'item_type' and 'pricing_type' as reactive state to toggle visibility of conditional fields. --><form class="space-y-8" id="product-form" novalidate="">
<!-- Step 1: Basic Info -->
<section class="step-transition" id="step-1"><div class="mb-8 p-6 bg-surface-container-low rounded-xl border border-white/10"><label class="block font-label-lg text-label-lg mb-4 text-on-surface-variant uppercase tracking-wider">Item Type</label><div class="flex gap-4"><label class="flex-1 cursor-pointer group"><input checked="" class="hidden peer" name="item_type" type="radio" value="physical"/><div class="p-4 border-2 border-white/10 rounded-xl flex items-center justify-center gap-3 peer-checked:border-primary-container peer-checked:bg-primary-container/5 transition-all group-hover:border-white/20"><span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary-container">inventory_2</span><span class="font-bold">Physical Product</span></div></label><label class="flex-1 cursor-pointer group"><input class="hidden peer" name="item_type" type="radio" value="service"/><div class="p-4 border-2 border-white/10 rounded-xl flex items-center justify-center gap-3 peer-checked:border-primary-container peer-checked:bg-primary-container/5 transition-all group-hover:border-white/20"><span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary-container">home_repair_service</span><span class="font-bold">Service</span></div></label></div></div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-6">Product Details</h2>
<div class="space-y-6 md:grid md:grid-cols-2 md:gap-8 md:space-y-0">
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant" for="product-name">Product Name</label>
<input class="w-full h-touch-target-min bg-surface-deep border border-white/10 rounded px-4 text-on-surface" id="product-name" name="name" placeholder="e.g. Handmade Leather Tote" required="" type="text"/>
</div>
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant" for="product-price">Price (IDR)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">Rp</span>
<div class="mb-4 flex gap-4"><label class="flex items-center gap-2 cursor-pointer"><input checked="" class="w-4 h-4 text-primary-container bg-surface-deep border-white/20 focus:ring-primary-container" name="pricing_type" type="radio" value="fixed"/><span class="text-body-sm">Fixed Price (Beli Sekarang)</span></label><label class="flex items-center gap-2 cursor-pointer"><input class="w-4 h-4 text-primary-container bg-surface-deep border-white/20 focus:ring-primary-container" name="pricing_type" type="radio" value="wa"/><span class="text-body-sm">Ask via WA (Tanya Harga)</span></label></div><input class="w-full h-touch-target-min bg-surface-deep border border-white/10 rounded pl-12 pr-4 text-on-surface" id="product-price" name="price" placeholder="0" required="" type="number"/>
</div>
</div>
</div>
</section>
<!-- Step 2: Description & Image -->
<section class="hidden step-transition" id="step-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-6">Description &amp; Media</h2>
<div class="space-y-6">
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant" for="product-desc">Description</label>
<textarea class="w-full bg-surface-deep border border-white/10 rounded p-4 text-on-surface resize-none" id="product-desc" name="description" placeholder="Describe the craftsmanship, materials, or features..." required="" rows="4"></textarea>
</div>
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant">Product Image</label>
<div class="relative w-full aspect-square bg-surface-deep border-2 border-dashed border-white/20 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-primary-container transition-colors group" id="image-upload-zone">
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" id="image-upload" type="file"/>
<div class="text-center p-6" id="upload-placeholder">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2 group-hover:text-primary-container" data-icon="cloud_upload">cloud_upload</span>
<p class="text-body-sm font-body-sm text-on-surface-variant">Tap to upload high-quality photo</p>
</div>
<img alt="" class="hidden w-full h-full object-cover rounded-xl" data-alt="A professionally lit studio product photograph showing a high-end luxury item on a dark blue velvet surface. The lighting is dramatic and cinematic, with soft yellow highlights that echo a canary yellow branding palette. The shot is crisp, high-contrast, and emphasizes texture and quality, fitting for a premium digital marketplace dashboard." id="image-preview" src=""/>
</div>
</div>
</div>
</section>
<!-- Error Message Region -->
<div aria-live="polite" class="hidden text-error font-body-sm text-center" id="form-errors">
                Please fill in all fields before proceeding.
            </div>
<!-- Action Buttons -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-background/80 backdrop-blur-md mx-auto left-1/2 md:max-w-4xl md:left-1/2 md:-translate-x-1/2 md:rounded-t-xl md:border-t md:border-white/10">
<button class="w-full h-touch-target-min bg-primary-container text-on-primary font-cta text-cta rounded uppercase tracking-wider active:scale-95 transition-transform" id="next-btn" type="button">
                    Next Step
                </button>
<button class="hidden w-full h-touch-target-min bg-primary-container text-on-primary font-cta text-cta rounded uppercase tracking-wider active:scale-95 transition-transform" id="save-btn" type="submit">
                    Save Product
                </button>
</div>
</form>
<!-- Success Modal Overlay -->
<div class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-container-padding" id="success-overlay">
<div class="bg-surface-container-low border-2 border-success-green success-pulse rounded-xl w-full max-w-sm p-8 text-center animate-in fade-in zoom-in duration-300">
<div class="w-16 h-16 bg-success-green/20 rounded-full flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-success-green text-4xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Product Added!</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-8">Your product is now live in the catalog. Share the link with your customers.</p>
<div class="relative mb-6">
<input class="w-full h-touch-target-min bg-surface-deep border border-white/10 rounded px-4 pr-12 text-on-surface-variant font-body-sm" readonly="" type="text" value="showmate.com/c/urban-goods"/>
<button class="absolute right-0 top-0 h-full px-4 text-primary-container active:scale-90 transition-transform" id="copy-btn" title="Copy link">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
</button>
<div class="hidden absolute -top-8 left-1/2 -translate-x-1/2 bg-ui-gray text-white text-[10px] px-2 py-1 rounded" id="copy-toast">Copied!</div>
</div>
<button class="w-full h-touch-target-min border border-primary-container text-primary-container font-cta text-cta rounded hover:bg-primary-container/10 transition-colors" onclick="location.reload()">
                    Add Another Product
                </button>
</div>
</div>
</main>
<script>
        const form = document.getElementById('product-form');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const dot1 = document.getElementById('step-dot-1');
        const dot2 = document.getElementById('step-dot-2');
        const dot3 = document.getElementById('step-dot-3');
        const nextBtn = document.getElementById('next-btn');
        const saveBtn = document.getElementById('save-btn');
        const errors = document.getElementById('form-errors');
        const imageInput = document.getElementById('image-upload');
        const imagePreview = document.getElementById('image-preview');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const successOverlay = document.getElementById('success-overlay');

        let currentStep = 1;

        // Step Management
        nextBtn.addEventListener('click', () => {
            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;

            if (name && price) {
                errors.classList.add('hidden');
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                nextBtn.classList.add('hidden');
                saveBtn.classList.remove('hidden');
                dot2.classList.replace('bg-surface-container-highest', 'bg-primary-container');
                currentStep = 2;
            } else {
                errors.classList.remove('hidden');
                errors.innerText = "Please provide product name and price.";
            }
        });

        // Image Preview Handler
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    uploadPlaceholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('product-desc').value;
            
            if (desc) {
                errors.classList.add('hidden');
                dot3.classList.replace('bg-surface-container-highest', 'bg-primary-container');
                
                // Show success message
                setTimeout(() => {
                    successOverlay.classList.remove('hidden');
                }, 400);
            } else {
                errors.classList.remove('hidden');
                errors.innerText = "Please provide a product description.";
            }
        });

        // Copy Link Feature
        document.getElementById('copy-btn').addEventListener('click', () => {
            const toast = document.getElementById('copy-toast');
            navigator.clipboard.writeText("showmate.com/c/urban-goods").then(() => {
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 2000);
            });
        });
    </script>
</body></html>
