<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ShowMate - Add Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom Focus State - Canary Yellow */
        input:focus, textarea:focus {
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(252, 212, 0, 0.4) !important;
            border-color: #fcd400 !important;
        }
        .step-transition {
            transition: all 0.3s ease-in-out;
        }
        .success-pulse {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(42, 181, 125, 0.4); }
            50% { border-color: rgba(42, 181, 125, 1); }
            100% { border-color: rgba(42, 181, 125, 0.4); }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffe16d",
                        "secondary-container": "#fcd400",
                        "secondary-fixed-dim": "#e9c400",
                        "on-secondary-fixed-variant": "#544600",
                        "on-error": "#ffffff",
                        "on-surface": "#1a1c1c",
                        "primary-container": "#003366",
                        "on-background": "#1a1c1c",
                        "on-primary": "#ffffff",
                        "ui-gray": "#404040",
                        "success-green": "#2AB57D",
                        "on-error-container": "#93000a",
                        "surface-tint": "#3a5f94",
                        "surface-container-highest": "#e2e2e2",
                        "on-tertiary-fixed": "#410000",
                        "on-secondary-fixed": "#221b00",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#930100",
                        "secondary-fixed": "#ffe16d",
                        "outline-variant": "#c3c6d1",
                        "on-primary-fixed": "#001b3c",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dadada",
                        "secondary": "#705d00",
                        "surface-container-high": "#e8e8e8",
                        "on-primary-container": "#799dd6",
                        "background": "#f9f9f9",
                        "soft-blue": "#E0F3F7",
                        "inverse-surface": "#2f3131",
                        "surface-container": "#eeeeee",
                        "surface-bright": "#f9f9f9",
                        "surface-container-low": "#f3f3f4",
                        "primary": "#001e40",
                        "tertiary": "#460000",
                        "surface-deep": "#ffffff",
                        "tertiary-fixed": "#ffdad4",
                        "inverse-primary": "#a7c8ff",
                        "on-secondary-container": "#6e5c00",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#a7c8ff",
                        "surface-variant": "#e2e2e2",
                        "outline": "#737780",
                        "on-tertiary-container": "#ff6d59",
                        "surface": "#f9f9f9",
                        "inverse-on-surface": "#f0f1f1",
                        "on-surface-variant": "#43474f",
                        "on-primary-fixed-variant": "#1f477b",
                        "tertiary-fixed-dim": "#ffb4a8",
                        "error": "#ba1a1a",
                        "tertiary-container": "#6e0000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-gap": "0.75rem",
                        "base": "4px",
                        "stack-gap": "1rem",
                        "touch-target-min": "44px",
                        "container-padding": "1.25rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],
                        "cta": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "label-lg": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "cta": ["16px", {"lineHeight": "1", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    
    /* Dark Mode Overrides for Accessibility */
    .dark body {
        background-color: #121414;
        color: #e2e2e2;
    }
    .dark header, .dark .fixed-bottom-nav {
        background-color: #121414;
        border-color: rgba(255,255,255,0.1);
    }
    .dark .bg-surface-deep {
        background-color: #1e2020;
    }
    .dark .bg-surface-container-highest {
        background-color: #333535;
    }
    .dark .text-on-surface-variant {
        color: #d0c6ab;
    }
    .dark .text-on-surface {
        color: #e2e2e2;
    }
    .dark .bg-primary-container {
        background-color: #fcd400; /* Use Canary Yellow for primary in dark mode */
        color: #221b00;
    }
    .dark .text-primary-container {
        color: #fcd400;
    }
    .dark .border-primary-container {
        border-color: #fcd400;
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- Top Navigation Header -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-touch-target-min bg-background border-b border-outline-variant/30 max-w-[480px] mx-auto left-1/2 -translate-x-1/2">
<button aria-label="Back to Catalog" class="flex items-center gap-2 text-on-surface-variant hover:opacity-80 active:scale-95 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="font-label-lg text-label-lg">Catalog</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">ShowMate</h1>
<button aria-label="Toggle Theme" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant" id="theme-toggle">
<span class="material-symbols-outlined dark:hidden" data-icon="dark_mode">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block" data-icon="light_mode">light_mode</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-24 px-container-padding max-w-[480px] mx-auto min-h-screen">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-8 mt-4">
<div class="h-1 flex-1 bg-secondary-container rounded-full transition-colors duration-300" id="step-dot-1"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full transition-colors duration-300" id="step-dot-2"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full transition-colors duration-300" id="step-dot-3"></div>
</div>
<form class="space-y-8" id="product-form" novalidate="">
<!-- Step 1: Basic Info -->
<section class="step-transition" id="step-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-6">Product Details</h2>
<div class="space-y-6">
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant" for="product-name">Product Name</label>
<input class="w-full h-touch-target-min bg-surface-deep border border-outline-variant/50 rounded px-4 text-on-surface" id="product-name" name="name" placeholder="e.g. Handmade Leather Tote" required="" type="text">
</div>
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant" for="product-price">Price (IDR)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">Rp</span>
<input class="w-full h-touch-target-min bg-surface-deep border border-outline-variant/50 rounded pl-12 pr-4 text-on-surface" id="product-price" name="price" placeholder="0" required="" type="number">
</div>
</div>
</div>
</section>
<!-- Step 2: Description & Image -->
<section class="hidden step-transition" id="step-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-6">Description &amp; Media</h2>
<div class="space-y-6">
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant" for="product-desc">Description</label>
<textarea class="w-full bg-surface-deep border border-outline-variant/50 rounded p-4 text-on-surface resize-none" id="product-desc" name="description" placeholder="Describe the craftsmanship, materials, or features..." required="" rows="4"></textarea>
</div>
<div>
<label class="block font-label-lg text-label-lg mb-2 text-on-surface-variant">Product Image</label>
<div class="relative w-full aspect-square bg-surface-deep border-2 border-dashed border-outline-variant/50 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-secondary-container transition-colors group" id="image-upload-zone">
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" id="image-upload" type="file">
<div class="text-center p-6" id="upload-placeholder">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2 group-hover:text-secondary-container" data-icon="cloud_upload">cloud_upload</span>
<p class="text-body-sm font-body-sm text-on-surface-variant">Tap to upload high-quality photo</p>
</div>
<img alt="" class="hidden w-full h-full object-cover rounded-xl" data-alt="A professionally lit studio product photograph showing a high-end luxury item on a dark blue velvet surface. The lighting is dramatic and cinematic, with soft yellow highlights that echo a canary yellow branding palette. The shot is crisp, high-contrast, and emphasizes texture and quality, fitting for a premium digital marketplace dashboard." id="image-preview" src="">
</div>
</div>
</div>
</section>
<!-- Error Message Region -->
<div aria-live="polite" class="hidden text-error font-body-sm text-center" id="form-errors">
                Please fill in all fields before proceeding.
            </div>
<!-- Action Buttons -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-background/80 backdrop-blur-md max-w-[480px] mx-auto left-1/2 -translate-x-1/2 fixed-bottom-nav"><div class="flex justify-between items-center mb-4 border-b border-outline-variant/30 pb-2"><button id="bottom-theme-toggle" class="flex flex-col items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-secondary-container transition-colors active:scale-95 focus:outline-none"><span class="material-symbols-outlined" data-icon="contrast">contrast</span><span class="text-[10px] font-label-lg uppercase tracking-wider">Theme</span></button></div>
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary-fixed font-cta text-cta rounded uppercase tracking-wider active:scale-95 transition-transform" id="next-btn" type="button">
                    Next Step
                </button>
<button class="hidden w-full h-touch-target-min bg-secondary-container text-on-secondary-fixed font-cta text-cta rounded uppercase tracking-wider active:scale-95 transition-transform" id="save-btn" type="submit">
                    Save Product
                </button>
</div>
</form>
<!-- Success Modal Overlay -->
<div class="hidden fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-container-padding" id="success-overlay">
<div class="bg-surface-container-low border-2 border-success-green success-pulse rounded-xl w-full max-w-sm p-8 text-center animate-in fade-in zoom-in duration-300">
<div class="w-16 h-16 bg-success-green/20 rounded-full flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-success-green text-4xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Product Added!</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-8">Your product is now live in the catalog. Share the link with your customers.</p>
<div class="relative mb-6">
<input class="w-full h-touch-target-min bg-surface-deep border border-outline-variant/50 rounded px-4 pr-12 text-on-surface-variant font-body-sm" readonly="" type="text" value="showmate.com/c/urban-goods">
<button class="absolute right-0 top-0 h-full px-4 text-secondary-container active:scale-90 transition-transform" id="copy-btn" title="Copy link">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
</button>
<div class="hidden absolute -top-8 left-1/2 -translate-x-1/2 bg-ui-gray text-white text-[10px] px-2 py-1 rounded" id="copy-toast">Copied!</div>
</div>
<button class="w-full h-touch-target-min border border-secondary-container text-secondary-container font-cta text-cta rounded hover:bg-secondary-container/10 transition-colors" onclick="location.reload()">
                    Add Another Product
                </button>
</div>
</div>
</main>
<script>
        const html = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const form = document.getElementById('product-form');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const dot1 = document.getElementById('step-dot-1');
        const dot2 = document.getElementById('step-dot-2');
        const dot3 = document.getElementById('step-dot-3');
        const nextBtn = document.getElementById('next-btn');
        const saveBtn = document.getElementById('save-btn');
        const errors = document.getElementById('form-errors');
        const imageInput = document.getElementById('image-upload');
        const imagePreview = document.getElementById('image-preview');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const successOverlay = document.getElementById('success-overlay');

        // Theme Toggle Handler
        themeToggle.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Initialize theme from storage
        if (localStorage.getItem('theme') === 'light') {
            html.classList.remove('dark');
        }

        // Step Management
        nextBtn.addEventListener('click', () => {
            const name = document.getElementById('product-name').value;
            const price = document.getElementById('product-price').value;

            if (name && price) {
                errors.classList.add('hidden');
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                nextBtn.classList.add('hidden');
                saveBtn.classList.remove('hidden');
                dot2.classList.replace('bg-surface-container-highest', 'bg-secondary-container');
                currentStep = 2;
            } else {
                errors.classList.remove('hidden');
                errors.innerText = "Please provide product name and price.";
            }
        });

        // Image Preview Handler
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    uploadPlaceholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('product-desc').value;
            
            if (desc) {
                errors.classList.add('hidden');
                dot3.classList.replace('bg-surface-container-highest', 'bg-secondary-container');
                
                // Show success message
                setTimeout(() => {
                    successOverlay.classList.remove('hidden');
                }, 400);
            } else {
                errors.classList.remove('hidden');
                errors.innerText = "Please provide a product description.";
            }
        });

        // Copy Link Feature
        document.getElementById('copy-btn').addEventListener('click', () => {
            const toast = document.getElementById('copy-toast');
            navigator.clipboard.writeText("showmate.com/c/urban-goods").then(() => {
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 2000);
            });
        });
    </script>


</body></html>
