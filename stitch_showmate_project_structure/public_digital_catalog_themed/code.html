<span class="font-label-sm text-label-sm">Stats</span>
</a>
<button aria-label="Toggle Theme" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-[#d0c6ab] h-full px-4 hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors focus-ring" id="navThemeToggle">
<span class="material-symbols-outlined" data-icon="contrast">contrast</span>
<span class="font-label-sm text-label-sm">Theme</span>
</button></nav>
<!-- Floating Action Button -->
<button aria-label="Share Catalog" class="fixed bottom-20 right-4 w-14 h-14 bg-primary dark:bg-[#ffd700] text-on-primary dark:text-[#3a3000] rounded-full shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-transform z-40 focus-ring md:right-[calc(50%-220px)]">
<span class="material-symbols-outlined" data-icon="share">share</span>
</button>
<script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    // Initialize based on current class
    function updateThemeIcon() {
        if (html.classList.contains('dark')) {
            themeIcon.textContent = 'light_mode';
        } else {
            themeIcon.textContent = 'dark_mode';
        }
    }

    themeToggle.addEventListener('click', () => {
        html.classList.toggle('dark');
        updateThemeIcon();
        
        // Optional: Local storage persistence
        localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    // Check preference on load
    if (localStorage.getItem('theme') === 'light') {
        html.classList.remove('dark');
    }
    updateThemeIcon();

    // Horizontal scroll with wheel for category chips
    const scrollContainer = document.querySelector('.overflow-x-auto');
    if(scrollContainer) {
        scrollContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });
    }
</script>
